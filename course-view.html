<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les | Vitalora</title>
  <meta name="description" content="Lees je Vitalora-les in alle rust.">
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('academySession') !== 'ok') {
          window.location.replace('/login');
          return;
        }
      } catch (error) {
        window.location.replace('/login');
        return;
      }

      var params = new URLSearchParams(window.location.search);
      var slug = params.get('course');
      var pathSlug = {
        'detox-cursus': 'clean-reset',
        powerfoods: 'powerfoods-superfood-specerij',
        'juiste-balans': 'de-juiste-balans',
        '30-dagen-challenge': '30-dagen-challenge',
        'everyday-nutrition': 'everyday-nutrition-praktisch-gezond',
        'mindful-energy': 'mindful-energy-innerlijke-rust',
        'energie-hormonen': 'energie-hormonen-balans'
      };
      if (!slug) slug = pathSlug[window.location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0]];

      var themes = {
        'clean-reset': ['#3a9aea', '#2563eb'],
        'powerfoods-superfood-specerij': ['#ef4444', '#dc2626'],
        'de-juiste-balans': ['#f59e0b', '#d97706'],
        '30-dagen-challenge': ['#f59e0b', '#d97706'],
        'everyday-nutrition-praktisch-gezond': ['#fbbf24', '#eab308'],
        'mindful-energy-innerlijke-rust': ['#a78bfa', '#8b5cf6'],
        'energie-hormonen-balans': ['#84cc16', '#65a30d']
      };
      if (themes[slug]) {
        document.documentElement.style.setProperty('--brand', themes[slug][0]);
        document.documentElement.style.setProperty('--brand-dark', themes[slug][1]);
      }
    })();
  </script>
  <link rel="icon" type="image/webp" href="/assets/images/vitalora logo.webp">
  <link rel="stylesheet" href="/assets/css/fonts.css?v=5">
  <link rel="stylesheet" href="/assets/css/course-reader.css?v=10">
</head>
<body>
  <aside class="sidebar" aria-label="Cursusnavigatie">
    <div class="s-brand">
      <a class="s-logo" href="/academy" aria-label="Terug naar Vitalora Academy">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M8 2 4 6l4 4"/>
        </svg>
        Vitalora
      </a>
      <div class="s-course" id="sCourse">Clean Reset</div>
    </div>

    <div class="s-prog">
      <div class="s-prog-top">
        <span class="s-prog-label">Voortgang</span>
        <span class="s-prog-count" id="sProgCount">0 / 0</span>
      </div>
      <div class="s-track" aria-hidden="true"><div class="s-track-fill" id="sProgFill"></div></div>
    </div>

    <nav class="s-nav" id="sNav" aria-label="Lessen">
      <div class="s-ch-label">Lessen laden...</div>
    </nav>

  </aside>

  <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

  <main class="main" id="main">
    <div class="rbar" aria-hidden="true"><div class="rbar-fill" id="rFill"></div></div>

    <header class="topbar">
      <div class="topbar-l">
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open cursuslessen" aria-expanded="false">☰</button>
        <span class="tb-label" id="tbLabel">Les 01</span>
        <span class="tb-sep" aria-hidden="true">·</span>
        <span class="tb-title" id="tbTitle">Les laden...</span>
      </div>
      <div class="rt-badge" aria-label="Leestijd"><span aria-hidden="true">◷</span><span id="rtBadge">— min leestijd</span></div>
    </header>

    <div class="wrap">
      <div class="lesson-head">
        <div class="lesson-meta">
          <div class="lesson-num-label" id="lessonNumber">Les 01 van 0</div>
          <span class="tag tag-o lesson-duration" id="lessonDuration" aria-label="Leestijd"></span>
        </div>
        <h1 class="title" id="lessonTitle">Les laden...</h1>
        <p class="lesson-lead" id="lessonLead">Even geduld, de les wordt geladen.</p>
        <div class="tags" id="lessonTags"></div>
      </div>

      <article class="content" id="lessonContent" aria-live="polite">
        <p>Lesinhoud laden...</p>
      </article>
    </div>
  </main>

  <script src="/assets/js/course-view.js?v=6" defer></script>
</body>
</html>
